# Canonical X-Plane 12 dashboard endpoint.
# The dashboard is static; telemetry is carried over the existing reverse SSH
# tunnel from host 4090 to tang-server:12678.

server {
    listen 80;
    listen [::]:80;
    server_name faa.subtokenai.com;
    root /www/wwwroot/faa.agaii.org/xplane12;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faa.subtokenai.com;
    root /www/wwwroot/faa.agaii.org/xplane12;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/faa.subtokenai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faa.subtokenai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLfaa:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    # The frontend polls these endpoints and receives the live bridge data.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Preserve the original /xplane12/ path as a compatibility alias.
    location ^~ /xplane12/api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ^~ /xplane12/v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }

    location = /xplane12/health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location = /faa {
        return 308 /;
    }

    location = /faa/ {
        return 308 /;
    }

    location ^~ /xplane12/ {
        rewrite ^/xplane12/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
