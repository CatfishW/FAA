# Compatibility route for the former https://api.agaii.org/faa endpoint.
# Keep this route live while faa.subtokenai.com is the canonical hostname.

server {
    listen 80;
    listen [::]:80;
    server_name api.agaii.org;
    include /www/server/panel/vhost/nginx/extension/api.agaii.org/*.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/api.agaii.org;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /faa {
        return 301 https://$host/faa/;
    }

    location ^~ /faa/ {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.agaii.org;
    include /www/server/panel/vhost/nginx/extension/api.agaii.org/*.conf;

    ssl_certificate /etc/letsencrypt/live/api.agaii.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.agaii.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSLapi:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 4k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    location = /faa {
        return 301 https://$host/faa/;
    }

    location ^~ /faa/api/ {
        proxy_pass http://127.0.0.1:12678/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /faa/health {
        proxy_pass http://127.0.0.1:12678/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location ^~ /faa/v1/ {
        proxy_pass http://127.0.0.1:12678/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /faa/ {
        root /www/wwwroot/faa.agaii.org/xplane12;
        try_files /index.html =404;
    }

    location ^~ /faa/ {
        rewrite ^/faa/(.*)$ /$1 break;
        root /www/wwwroot/faa.agaii.org/xplane12;
        try_files $uri $uri/ /index.html;
    }
}
